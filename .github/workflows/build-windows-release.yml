name: Build Windows Release

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout windows-port branch
      uses: actions/checkout@v4
      with:
        ref: windows-port

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      working-directory: ./Windows
      run: dotnet restore

    - name: Build Release EXE
      working-directory: ./Windows
      shell: pwsh
      run: |
        dotnet publish `
          --configuration Release `
          --runtime win-x64 `
          --self-contained `
          --output build/output `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:PublishReadyToRun=true

    - name: Create ZIP archive
      working-directory: ./Windows
      shell: pwsh
      run: |
        $version = "${{ github.event.release.tag_name }}"
        Compress-Archive -Path build/output -DestinationPath "AirGlass-Windows-$version.zip"
        Move-Item "AirGlass-Windows-$version.zip" ../

    - name: Upload artifacts to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: pwsh
      run: |
        $version = "${{ github.event.release.tag_name }}"
        gh release upload $version "Windows/build/output/AirGlass.exe" "AirGlass-Windows-$version.zip" --clobber

    - name: Comment on release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: pwsh
      run: |
        $version = "${{ github.event.release.tag_name }}"
        gh release view $version --json body --jq .body | Out-Null
        gh release edit $version --notes "✅ Windows EXE now available!

📥 Download:
- **AirGlass.exe** - Standalone executable (no installation needed)
- **AirGlass-Windows-$version.zip** - Packaged release

Simply download and run on Windows 10+ — ready to go!

---

" || true
