name: Build Windows Release

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout windows-port branch
      uses: actions/checkout@v4
      with:
        ref: windows-port

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      working-directory: ./Windows
      run: dotnet restore

    - name: Build Release EXE
      working-directory: ./Windows
      run: dotnet publish --configuration Release --runtime win-x64 --self-contained --output build/output -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true

    - name: Create ZIP archive
      working-directory: ./Windows/build/output
      run: powershell -Command "Compress-Archive -Path . -DestinationPath ../AirGlass-Windows-${{ github.event.release.tag_name }}.zip"

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          Windows/build/output/AirGlass.exe
          Windows/build/AirGlass-Windows-${{ github.event.release.tag_name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
