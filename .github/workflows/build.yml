name: Build

on:
  push:
  pull_request:

jobs:
  strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check interface texts (Localization/Strings.json)
        run: python3 scripts/check-strings.py

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project AirGlass.xcodeproj -scheme AirGlass -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package DMG (ad-hoc signed)
        run: scripts/make-dmg.sh
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: AirGlass-dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build, package and smoke-test the EXE
        shell: pwsh
        run: ./scripts/windows-publish.ps1
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AirGlass-exe
          path: dist/AirGlass-*.exe
          if-no-files-found: error
