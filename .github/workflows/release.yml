name: Release

# Builds the DMG and publishes a GitHub Release with the notes in
# .github/release-notes/v<version>.md. Two ways to start it:
#   - push a tag like v0.1.0, or
#   - run it from the Actions tab ("Run workflow") with a version; the tag
#     v<version> is then created on the selected branch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (must match MARKETING_VERSION)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check that the tag matches the app version
        run: |
          version=$(grep -E '^\s*MARKETING_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match MARKETING_VERSION $version in project.yml" >&2
            exit 1
          fi
          test -f ".github/release-notes/$TAG.md" || { echo "Missing .github/release-notes/$TAG.md" >&2; exit 1; }

      - name: Build DMG
        run: scripts/make-dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            target=(--target "$GITHUB_SHA")   # creates the tag here
          else
            target=(--verify-tag)             # the pushed tag must exist
          fi
          gh release create "$TAG" dist/*.dmg \
            --title "AirGlass ${TAG#v}" \
            --notes-file ".github/release-notes/$TAG.md" \
            "${target[@]}"
