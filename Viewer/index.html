<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>AirGlass</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <video id="video" autoplay playsinline muted disablepictureinpicture disableremoteplayback></video>

  <!-- 1 · Bağlanıyor -->
  <div id="connecting" class="center">
    <div class="connecting">
      <svg class="spinner" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2.5"/><path d="M14 3a11 11 0 0 1 11 11" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/></svg>
      <span role="status">Bağlanıyor…</span>
    </div>
    <div class="brand"><svg width="13" height="12" viewBox="0 0 510 470" aria-hidden="true"><path d="M38 180 L30 182 L22 185 L12 192 L5 202 L2 210 L0 218 L0 432 L2 440 L5 448 L10 455 L15 460 L22 465 L30 468 L42 470 L378 470 L390 468 L398 465 L403 462 L181 462 L174 461 L161 457 L155 454 L144 446 L134 436 L126 425 L121 412 L118 399 L118 180Z" fill="#FFFFFF" fill-opacity="0.3"/><path d="M188 100 L179 101 L170 104 L158 111 L151 118 L146 125 L142 134 L140 143 L140 392 L142 406 L148 419 L154 426 L165 434 L174 438 L188 440 L402 440 L416 438 L429 432 L332 432 L318 431 L304 426 L291 420 L280 410 L270 399 L264 386 L261 379 L259 372 L258 358 L258 100Z" fill="#FFFFFF" fill-opacity="0.58"/><path d="M463 0 L332 0 L322 1 L317 2 L307 6 L299 12 L292 19 L289 23 L284 32 L282 37 L281 42 L280 52 L280 363 L281 368 L284 378 L286 383 L292 391 L299 398 L303 401 L312 406 L317 408 L327 410 L332 410 L458 410 L468 409 L478 406 L483 404 L491 398 L498 391 L501 387 L506 378 L508 373 L510 363 L510 358 L510 47 L508 37 L504 27 L498 19 L491 12 L483 6 L473 2Z" fill="#FFFFFF"/></svg><span>AirGlass</span></div>
  </div>

  <!-- 3 · Bağlantı kesildi (and other endings) -->
  <div id="ended" class="center" hidden>
    <div class="ended">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-.8.8"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l.8-.8"/><path d="M4 4l16 16"/></svg>
      <span id="ended-title" class="ended-title" role="status">Bağlantı kesildi</span>
      <span id="ended-message" class="ended-message">Yeniden izlemek için Mac'teki QR kodu yeniden okutun.</span>
    </div>
  </div>

  <!-- 2 · Yayında: tam ekran düğmesi -->
  <button id="fullscreen" type="button" aria-label="Tam ekran" hidden>
    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5V3h4.5M17 7.5V3h-4.5M3 12.5V17h4.5M17 12.5V17h-4.5"/><path d="M3 3l4.5 4.5M17 3l-4.5 4.5M3 17l4.5-4.5M17 17l-4.5-4.5"/></svg>
  </button>

  <!-- Diagnostics -->
  <button id="debug-toggle" type="button" aria-label="Günlüğü göster" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
  </button>
  <div id="debug" hidden></div>

  <script src="viewer.js"></script>
</body>
</html>
