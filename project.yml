name: AirGlass

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: tr

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 154.0.0

targets:
  AirGlass:
    type: application
    platform: macOS
    sources:
      - path: AirGlass
        excludes:
          - "Info.plist"
      # Phone-side viewer page, copied as Resources/Viewer.
      - path: Viewer
        type: folder
        buildPhase: resources
    dependencies:
      - package: WebRTC
    # Signing and bundle ID live in the xcconfig so they can be overridden
    # per developer via the git-ignored Config/Local.xcconfig.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        INFOPLIST_FILE: AirGlass/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    scheme: {}
